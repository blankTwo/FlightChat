<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F0F0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="512" height="512" rx="115" fill="url(#bgGradient)"/>

  <!-- 大写字母 F（斜体风格，代表 Flight） -->
  <g transform="translate(140, 140)">
    <path d="M 40 0 L 180 0 L 175 45 L 85 45 L 75 100 L 155 100 L 150 140 L 70 140 L 50 240 L 0 240 Z"
          fill="url(#fGradient)"
          style="font-style: italic"/>
  </g>

  <!-- 纸飞机图标（右下角） -->
  <g transform="translate(330, 340) scale(0.8)" opacity="0.9">
    <path d="M 0 0 L 80 40 L 30 50 L 20 90 Z" fill="#FFFFFF" stroke="#357ABD" stroke-width="3"/>
    <line x1="30" y1="50" x2="55" y2="75" stroke="#357ABD" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
